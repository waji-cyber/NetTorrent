# Builds the NetTorrent Android APK on GitHub's servers.
#
# You do NOT need the Flutter SDK or Android Studio on your own PC.
# Steps: push this repo to GitHub -> Actions tab -> run this workflow ->
# download the "NetTorrent-android-apk" artifact and install it on your phone.
name: Build NetTorrent (Android APK)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.nettorrent .
          rm -f test/widget_test.dart

      - name: Enable core library desugaring
        # flutter_local_notifications requires desugaring; flutter create
        # regenerates build.gradle.kts, so patch it every run.
        run: |
          python3 - <<'EOF'
          p = "android/app/build.gradle.kts"
          s = open(p).read()
          anchor = "targetCompatibility = JavaVersion.VERSION_17\n    }"
          assert anchor in s, "compileOptions block not found"
          s = s.replace(anchor, anchor.replace("    }", "        isCoreLibraryDesugaringEnabled = true\n    }"))
          if "coreLibraryDesugaring" not in s:
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          open(p, "w").write(s)
          print("desugaring patched")
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetTorrent-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
